server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Blazor WASM SPA: serve static files, fall back to index.html for client routes.
    # (/api is routed to the API by Traefik, so it never reaches here — no clash.)
    #
    # no-cache (revalidate, don't blindly reuse) for the app shell and our own hand-written,
    # unhashed assets (index.html, css/*, castle-header.js, the scoped-CSS bundle). Without this
    # a browser keeps serving an old app.css after a redeploy, so CSS-only changes never appear.
    # It's a cheap conditional request per load (nginx answers 304 via ETag when unchanged).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The framework assets are content-hashed by the build, so they're safe to cache forever.
    location /_framework/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
