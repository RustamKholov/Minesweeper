server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Blazor WASM SPA: serve static files, fall back to index.html for client routes.
    # (/api is routed to the API by Traefik, so it never reaches here — no clash.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable framework assets; the .wasm mime is in nginx's default types.
    location /_framework/ {
        try_files $uri =404;
    }
}
