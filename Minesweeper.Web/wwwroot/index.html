<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Minesweeper</title>
    <base href="/" />

    <!-- PWA / add-to-home-screen support so mobile browsers can launch this full screen,
         without the address bar and browser chrome, like a native app. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#20232a" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minesweeper" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <!-- ?v= busts any stale cached copy on redeploy; bump when these files change. The nginx
         config also sends no-cache for these, so this is mainly a one-shot cache breaker. -->
    <link rel="stylesheet" href="css/tokens.css?v=20260703" />
    <link rel="stylesheet" href="css/lcd.css?v=20260703" />
    <link rel="stylesheet" href="css/app.css?v=20260703" />
    <link href="Minesweeper.Web.styles.css?v=20260703" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- Board viewport measurement for the camera-follow navigation (GameBoard). -->
    <script>
        window.msBoard = {
            measure: function (el) {
                if (!el) return [0, 0];
                return [el.clientWidth, el.clientHeight];
            },
            // Capture the pointer to the cell under (x,y) so a drag keeps reporting to that same
            // origin cell even as the board slides beneath the finger (used by grab-to-pan).
            capture: function (x, y, pointerId) {
                try {
                    var el = document.elementFromPoint(x, y);
                    if (el && el.setPointerCapture) el.setPointerCapture(pointerId);
                } catch (e) { /* capture is best-effort */ }
            },
            // Set the board translate directly, bypassing a Blazor re-render of every cell. This
            // is what keeps grab-to-pan (and its inertia glide) smooth on large boards.
            setTransform: function (el, x, y) {
                if (el) el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
            }
        };
        // Notify .NET whenever fullscreen state changes (button, Esc, or system gesture) so the
        // header's fullscreen toggle icon and the immersive exit button stay in sync.
        window.msFullscreen = {
            watch: function (dotnetRef) {
                var fire = function () {
                    var fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    // Drive immersive CSS off a class rather than the :fullscreen pseudo, which is
                    // inconsistent across mobile browsers for element-fullscreen.
                    document.documentElement.classList.toggle('ms-fullscreen', fs);
                    dotnetRef.invokeMethodAsync('OnFullscreenChanged', fs);
                };
                document.addEventListener('fullscreenchange', fire);
                document.addEventListener('webkitfullscreenchange', fire);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Castle of Glass ecosystem header (brand → portal, app-switcher, sign out).
         Hidden automatically when the game goes browser-fullscreen. -->
    <script src="castle-header.js?v=20260703" data-app-name="Minesweeper"
            data-portal="https://rh-cloud.org/portal"
            data-auth="https://auth.rh-cloud.org"
            data-catalog="https://rh-cloud.org/apps.json"></script>
</body>

</html>
